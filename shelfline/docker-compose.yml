version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shelfline-db
    environment:
      POSTGRES_USER: shelfline
      POSTGRES_PASSWORD: shelfline
      POSTGRES_DB: shelfline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfline -d shelfline"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shelfline-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://shelfline:shelfline@postgres:5432/shelfline
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shelfline-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data: