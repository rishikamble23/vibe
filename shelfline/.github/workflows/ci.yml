name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shelfline/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: shelfline/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://shelfline:shelfline@localhost:5432/shelfline

      - name: Check Alembic migrations
        run: alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://shelfline:shelfline@localhost:5432/shelfline

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shelfline
          POSTGRES_PASSWORD: shelfline
          POSTGRES_DB: shelfline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelfline -d shelfline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shelfline/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: shelfline/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build